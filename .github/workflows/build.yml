name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # to publish a release for each new version

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: ubuntu-22.04, name: linux }
          - { os: macos-latest, name: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux build libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the app
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: spawnpoint-launcher-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14
      - name: Publish the release for this version
        # A push to main with a version that has no release yet publishes one (v<version> from
        # tauri.conf.json), so the download page's links always find the newest build.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=v$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          for i in 1 2 3; do
            gh release view "$V" >/dev/null 2>&1 && break
            gh release create "$V" --target "$GITHUB_SHA" --title "$V" \
              --notes "Unsigned build: Windows and macOS warn that the developer is unknown." && break
            sleep $((RANDOM % 10 + 5))   # the three systems' builds race to create it
          done
          shopt -s nullglob
          gh release upload "$V" src-tauri/target/release/bundle/{nsis/*.exe,appimage/*.AppImage,deb/*.deb,dmg/*.dmg} --clobber
